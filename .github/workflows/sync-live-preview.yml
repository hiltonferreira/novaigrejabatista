name: Sync live homepage to preview

on:
  push:
    branches:
      - eventos-carousel-preview
    paths:
      - .github/workflows/sync-live-preview.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: eventos-carousel-preview

      - name: Mirror current live homepage and its local assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlsplit, unquote
          import re

          BASE = 'https://novaigrejabatista.com.br/'
          UA = {'User-Agent': 'Mozilla/5.0 (compatible; NIB-Git-Sync/1.0)'}
          ALLOWED = {'.css','.js','.png','.jpg','.jpeg','.webp','.svg','.woff','.woff2','.ttf','.mp4','.webm','.ico'}

          def fetch(url):
              req = Request(url, headers=UA)
              with urlopen(req, timeout=45) as r:
                  return r.read()

          def clean_ref(raw):
              raw = (raw or '').strip().strip('"\'')
              if not raw or raw.startswith(('#','data:','mailto:','tel:','javascript:','//')):
                  return None
              parts = urlsplit(raw)
              if parts.scheme or parts.netloc:
                  return None
              path = unquote(parts.path).lstrip('/')
              if not path or '..' in Path(path).parts:
                  return None
              return path

          html_bytes = fetch(BASE)
          Path('index.html').write_bytes(html_bytes)
          html = html_bytes.decode('utf-8', 'replace')

          refs = set()
          for raw in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html, flags=re.I):
              ref = clean_ref(raw)
              if ref and Path(ref).suffix.lower() in ALLOWED:
                  refs.add(ref)
          for raw in re.findall(r'url\(\s*["\']?([^\)"\']+)', html, flags=re.I):
              ref = clean_ref(raw)
              if ref and Path(ref).suffix.lower() in ALLOWED:
                  refs.add(ref)

          queue = list(sorted(refs))
          seen = set()
          while queue:
              ref = queue.pop(0)
              if ref in seen:
                  continue
              seen.add(ref)
              try:
                  data = fetch(urljoin(BASE, ref))
              except Exception as exc:
                  print(f'WARN: {ref}: {exc}')
                  continue
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f'SYNC {ref} ({len(data)} bytes)')

              if target.suffix.lower() == '.css':
                  css = data.decode('utf-8', 'replace')
                  for raw in re.findall(r'url\(\s*["\']?([^\)"\']+)', css, flags=re.I):
                      sub = clean_ref(raw)
                      if not sub:
                          continue
                      # CSS URLs are relative to the stylesheet folder.
                      if not raw.startswith('/'):
                          sub = str((target.parent / sub).as_posix())
                      if Path(sub).suffix.lower() in ALLOWED and sub not in seen:
                          queue.append(sub)

          # This workflow is intentionally one-shot: remove itself after syncing.
          Path('.github/workflows/sync-live-preview.yml').unlink(missing_ok=True)
          PY

      - name: Commit synchronized baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync preview branch with current live site"
          git push origin HEAD:eventos-carousel-preview
