name: Update NXT eyebrow

on:
  push:
    branches:
      - eventos-carousel-preview
    paths:
      - .github/workflows/update-nxt-eyebrow.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eventos-carousel-preview

      - name: Update NXT eyebrow text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="eyebrow">Encontro de adolescentes</span>'
          new = '<span class="eyebrow">Acampamento dos Adolescentes</span>'
          if old not in s:
              raise SystemExit('Texto antigo não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/update-nxt-eyebrow.yml').unlink(missing_ok=True)
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update NXT event eyebrow"
          git push origin HEAD:eventos-carousel-preview
