name: Apply featured events carousel preview

on:
  push:
    branches:
      - eventos-carousel-preview
    paths:
      - .github/workflows/apply-event-carousel-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eventos-carousel-preview
      - name: Apply carousel patch
        run: python3 scripts/apply_event_carousel.py
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-event-carousel-preview.yml
      - name: Commit preview carousel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NXT CAMP to featured events carousel"
          git push origin HEAD:eventos-carousel-preview
