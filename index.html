/* ===== Galeria coverflow ===== */
(function(){
  const stage=document.getElementById('galStage');
  if(!stage) return;
  const cards=[...stage.querySelectorAll('.gal-card')];
  const total=cards.length;
  let current=0, timer=null;

  const videoCards=cards.filter(card=>card.classList.contains('gal-card-video'));

  function activeVideoCard(){
    return videoCards.find(card=>card.classList.contains('pos-center')) || null;
  }

  function syncVideos(){
    videoCards.forEach(card=>{
      const vid=card.querySelector('.gal-video');
      if(!vid) return;
      if(card.classList.contains('pos-center')){
        vid.play().catch(()=>{});
      }else{
        vid.pause();
      }
    });
  }

  function layout(){
    cards.forEach((card,i)=>{
      card.classList.remove('pos-center','pos-left','pos-right','pos-far-left','pos-far-right');
      let diff=(i-current+total)%total;
      if(diff===0) card.classList.add('pos-center');
      else if(diff===1) card.classList.add('pos-right');
      else if(diff===total-1) card.classList.add('pos-left');
      else if(diff===2) card.classList.add('pos-far-right');
      else if(diff===total-2) card.classList.add('pos-far-left');
      else card.classList.add('pos-far-right');
    });
    syncVideos();
  }

  function next(){ current=(current+1)%total; layout(); }
  function prev(){ current=(current-1+total)%total; layout(); }

  function startAuto(){
    stopAuto();
    if(activeVideoCard()) return;
    timer=setInterval(next,3500);
  }
  function stopAuto(){ if(timer){clearInterval(timer);timer=null;} }

  document.getElementById('galNext').addEventListener('click',()=>{next();startAuto();});
  document.getElementById('galPrev').addEventListener('click',()=>{prev();startAuto();});

  cards.forEach((card,i)=>card.addEventListener('click',(e)=>{
    if(e.target.closest('.gal-video-controls')) return;
    if(!card.classList.contains('pos-center')){ current=i; layout(); startAuto(); }
  }));

  const gallery=document.getElementById('gallery');
  gallery.addEventListener('mouseenter',stopAuto);
  gallery.addEventListener('mouseleave',startAuto);

  videoCards.forEach(card=>{
    const vid=card.querySelector('.gal-video');
    const playBtn=card.querySelector('.gal-video-play, #galVidPlay');
    const soundBtn=card.querySelector('.gal-video-sound, #galVidSound');
    if(!vid||!playBtn||!soundBtn) return;

    const icPause=playBtn.querySelector('.ic-pause');
    const icPlay=playBtn.querySelector('.ic-play');
    const icMuted=soundBtn.querySelector('.ic-muted');
    const icUnmuted=soundBtn.querySelector('.ic-unmuted');
    const label=soundBtn.querySelector('.gal-vc-label');

    playBtn.addEventListener('click',()=>{
      if(vid.paused){ vid.play().catch(()=>{}); } else { vid.pause(); }
    });
    vid.addEventListener('play',()=>{
      if(icPause) icPause.style.display='';
      if(icPlay) icPlay.style.display='none';
    });
    vid.addEventListener('pause',()=>{
      if(icPause) icPause.style.display='none';
      if(icPlay) icPlay.style.display='';
    });
    soundBtn.addEventListener('click',()=>{
      vid.muted=!vid.muted;
      if(vid.muted){
        if(icMuted) icMuted.style.display='';
        if(icUnmuted) icUnmuted.style.display='none';
        if(label) label.textContent='Ativar som';
      }else{
        if(icMuted) icMuted.style.display='none';
        if(icUnmuted) icUnmuted.style.display='';
        if(label) label.textContent='Som ativado';
      }
    });
  });

  layout();
  startAuto();
})();

    var all=[].slice.call(xml.getElementsByTagName("entry"));
    // deduplica por videoId E por título normalizado (pega 3 distintos)
    var seenId={}, seenTitle={}, entries=[];
    for(var k=0;k<all.length;k++){
      var vidk=(all[k].getElementsByTagName("yt:videoId")[0]||{}).textContent||"";
      var titk=((all[k].getElementsByTagName("title")[0]||{}).textContent||"")
                 .toLowerCase().replace(/\s+/g," ").trim();
      if(!vidk||seenId[vidk]||seenTitle[titk]) continue;
      seenId[vidk]=1; seenTitle[titk]=1; entries.push(all[k]);
      if(entries.length===3) break;
    }
    if(!entries.length) throw 0;
    var play='<div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
    box.innerHTML=entries.map(function(en,idx){
      var vid=(en.getElementsByTagName("yt:videoId")[0]||{}).textContent||"";
      var title=(en.getElementsByTagName("title")[0]||{}).textContent||"Mensagem";
      var link="https://www.youtube.com/watch?v="+vid;
      var hi="https://i.ytimg.com/vi/"+vid+"/maxresdefault.jpg";
      var fb="https://i.ytimg.com/vi/"+vid+"/hqdefault.jpg";
      return '<a class="video reveal in" style="transition-delay:'+(idx*.1)+'s" href="'+link+'" target="_blank" rel="noopener">'+
        '<div class="thumb"><span class="tag-watch">Assista</span><img src="'+hi+'" alt="'+esc(title)+'" loading="lazy" '+
        'onerror="this.onerror=null;this.src=\''+fb+'\'">'+play+'</div>'+
        '<div class="meta"><b>'+esc(title)+'</b><span>Youtube · Nova Igreja Batista</span></div></a>';
    }).join("");
  }

  tryFetch(0).then(render).catch(function(){
    // Fallback: mantém 3 cards levando ao canal
    box.querySelectorAll(".thumb").forEach(function(t){t.classList.remove("skeleton");});
    box.querySelectorAll(".meta b").forEach(function(b){b.textContent="Ver últimos vídeos no YouTube";});
  });
})();
</script>
</body>
</html>
